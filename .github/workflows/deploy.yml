name: deploy

# Deploys one application environment (ADR 0019). Dispatched by a person; the
# job waits on that environment's GitHub Environment (reviewers, variables).
# AWS access is short-lived via GitHub OIDC; no stored AWS keys.
#
# Order, so code never runs ahead of its schema (a paused environment is woken first):
#   1. registry stack, then build and push the release images (tag = commit SHA), in
#      parallel with layers cached between runs
#   2. app stack with the release on the one-off tasks only; services stay on the
#      image they run (zero tasks on a first deploy)
#   3. migrations (one-off task); a failure stops here
#   4. app stack again with the services on the release; wait for them; smoke test
#   5. the environment's copy of the marketing site, built to point at this app (never indexed)
#
# Fast path: when no migration changed since the release the services run, steps 2 and 3 are
# skipped and step 4 moves everything in one deploy; when nothing under the site changed, step 5
# is skipped. Only services whose code changed get a new image (scripts/service-changed.sh); the
# others stay on the image they run, untouched. In dev and qa the worker is moved alongside the stack
# update (scripts/roll-worker.sh). A first deploy, or `full`, always runs and moves everything.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, qa]
        required: true
      full:
        description: Run every step (migrations and site), even if nothing changed for them
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  # The organization's guardrail allows CloudFormation only in us-east-2 (ADR 0003 amendment).
  AWS_REGION: us-east-2
  ENV_NAME: ${{ inputs.environment }}
  TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.release.outputs.origin }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The plan compares this commit with the one the services run.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Names
        run: |
          STACK="Pactlab$(echo "${ENV_NAME:0:1}" | tr a-z A-Z)${ENV_NAME:1}"
          echo "STACK=$STACK" >> "$GITHUB_ENV"
          echo "CDK=pnpm --filter @pactlab/cdk exec cdk -c pactlab:${ENV_NAME}:account=${{ vars.AWS_ACCOUNT_ID }} -c pactlab:${ENV_NAME}:imageTag=${TAG} -c pactlab:${ENV_NAME}:githubOidc=existing" >> "$GITHUB_ENV"

      # What this release needs: migrations only if a migration changed, the site only if the site changed,
      # and a new image only for the services whose code changed.
      - name: Plan
        id: plan
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs" --output json 2>/dev/null || echo '[]')
          out() { node -e 'const o = (JSON.parse(process.argv[1]) || []).find((x) => x.OutputKey === process.argv[2]); console.log(o ? o.OutputValue : "")' "$OUTPUTS" "$1"; }
          CURRENT=$(out ServiceImageTag)
          if [ -z "$CURRENT" ] || [ "$CURRENT" = "None" ]; then CURRENT=none; fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          changed() {  # true unless the running commit is known and nothing under these paths changed since it
            [ "${{ inputs.full }}" = "true" ] && { echo true; return; }
            [ "$CURRENT" = none ] && { echo true; return; }
            git cat-file -e "${CURRENT}^{commit}" 2>/dev/null || { echo true; return; }
            git diff --quiet "$CURRENT" "$TAG" -- "$@" && echo false || echo true
          }
          MIGRATIONS=$(changed packages/db/prisma apps/api/src/ops/migrate.ts)
          SITE=$(changed apps/site infra/cdk/lib/site-stack.ts infra/cdk/config .github/workflows/deploy.yml)
          aws cloudformation describe-stacks --stack-name "${STACK}Site" >/dev/null 2>&1 || SITE=true
          echo "migrations=$MIGRATIONS" >> "$GITHUB_OUTPUT"
          echo "site=$SITE" >> "$GITHUB_OUTPUT"
          echo "Services run: $CURRENT · migrations needed: $MIGRATIONS · site changed: $SITE"
          # Per image: what it runs now (stacks from before per-service tags: the release), and whether it changed.
          for IMAGE in web api worker tools; do
            RUNNING=$(out "$(echo "${IMAGE:0:1}" | tr a-z A-Z)${IMAGE:1}ImageTag")
            if [ -z "$RUNNING" ] || [ "$RUNNING" = None ]; then
              [ "$IMAGE" = tools ] && RUNNING=$(out ReleaseImageTag) || RUNNING=$CURRENT
            fi
            if [ -z "$RUNNING" ] || [ "$RUNNING" = None ]; then RUNNING=none; fi
            if [ "${{ inputs.full }}" = "true" ]; then CHANGED=true
            elif [ "$IMAGE" = tools ]; then
              CHANGED=$MIGRATIONS; [ "$CHANGED" = true ] || CHANGED=$(scripts/service-changed.sh server "$RUNNING")
            else CHANGED=$(scripts/service-changed.sh "$IMAGE" "$RUNNING"); fi
            echo "${IMAGE}_running=$RUNNING" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}_changed=$CHANGED" >> "$GITHUB_OUTPUT"
            echo "$IMAGE: runs $RUNNING · changed: $CHANGED"
          done

      # dev, qa and stage pause when idle (ADR 0019): wake a paused environment before changing it.
      - name: 0. Make sure the environment is awake
        run: scripts/wake-environment.sh "$ENV_NAME"

      # dev and qa share one network, NAT instance, load balancer and Redis (ADR 0019); a no-op when unchanged.
      - name: 1. Shared non-live base (dev and qa)
        if: env.ENV_NAME == 'dev' || env.ENV_NAME == 'qa'
        run: $CDK deploy PactlabNonliveBase --require-approval never

      - name: 1. Registry
        run: $CDK deploy "${STACK}Registry" --require-approval never

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3

      # Each image's tag for this release: the new commit if it changed (or its running image is gone), else the
      # tag it runs. Builds only new images not already pushed.
      - name: 1. Which images this commit still needs
        id: need
        run: |
          exists() { aws ecr describe-images --repository-name "pactlab-${ENV_NAME}-$1" --image-ids imageTag="$2" >/dev/null 2>&1; }
          TARGETS=""; RELEASE_CTX=""; RUNNING_CTX=""
          for IMAGE in web api worker tools; do
            case "$IMAGE" in web) REPO=web; TARGET=web; SUFFIX="" ;; tools) REPO=server; TARGET=tools; SUFFIX=-tools ;; *) REPO=server; TARGET=server; SUFFIX="" ;; esac
            R="RUNNING_$IMAGE"; C="CHANGED_$IMAGE"; RUNNING=${!R}; CHANGED=${!C}
            if [ "$CHANGED" != true ] && [ "$RUNNING" != none ] && exists "$REPO" "$RUNNING$SUFFIX"; then
              USE=$RUNNING
              echo "$IMAGE: stays on $RUNNING"
            else
              USE=$TAG
              if exists "$REPO" "$TAG$SUFFIX"; then echo "$IMAGE: pactlab-${ENV_NAME}-${REPO}:${TAG}${SUFFIX} already pushed"
              else case ",$TARGETS," in *",$TARGET,"*) ;; *) TARGETS="${TARGETS:+$TARGETS,}$TARGET" ;; esac; fi
            fi
            RELEASE_CTX="$RELEASE_CTX -c pactlab:${ENV_NAME}:${IMAGE}ImageTag=$USE"
            # While migrations run, services stay where they are; the one-off tasks get the release.
            if [ "$IMAGE" = tools ]; then RUNNING_CTX="$RUNNING_CTX -c pactlab:${ENV_NAME}:toolsImageTag=$USE"
            elif [ "$RUNNING" != none ]; then RUNNING_CTX="$RUNNING_CTX -c pactlab:${ENV_NAME}:${IMAGE}ImageTag=$RUNNING"; fi
          done
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "RELEASE_CTX=$RELEASE_CTX" >> "$GITHUB_ENV"
          echo "RUNNING_CTX=$RUNNING_CTX" >> "$GITHUB_ENV"
          echo "build: ${TARGETS:-nothing}"
        env:
          RUNNING_web: ${{ steps.plan.outputs.web_running }}
          RUNNING_api: ${{ steps.plan.outputs.api_running }}
          RUNNING_worker: ${{ steps.plan.outputs.worker_running }}
          RUNNING_tools: ${{ steps.plan.outputs.tools_running }}
          CHANGED_web: ${{ steps.plan.outputs.web_changed }}
          CHANGED_api: ${{ steps.plan.outputs.api_changed }}
          CHANGED_worker: ${{ steps.plan.outputs.worker_changed }}
          CHANGED_tools: ${{ steps.plan.outputs.tools_changed }}

      # The new images in one parallel build, sharing the dependency and build layers. Layers are cached in
      # GitHub Actions' cache between runs (server and tools: shared; web: per environment), so a code-only change
      # skips the package download and reuses everything that did not change. See infra/docker/docker-bake.hcl.
      - name: 1. Build and push images (parallel, cached)
        if: steps.need.outputs.targets != ''
        uses: docker/bake-action@v6
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ENV_NAME: ${{ env.ENV_NAME }}
          TAG: ${{ env.TAG }}
          APP_ENV: ${{ vars.APP_ENV }}
          ORIGIN: https://${{ vars.APP_DOMAIN }}
          CACHE: gha
        with:
          source: .
          files: infra/docker/docker-bake.hcl
          targets: ${{ steps.need.outputs.targets }}
          push: true

      - name: 2. Ship the release to the one-off tasks (services stay on their current image)
        if: steps.plan.outputs.migrations == 'true'
        run: |
          CURRENT="${{ steps.plan.outputs.current }}"
          echo "Services stay on: $CURRENT"
          $CDK diff "$STACK" --method=template -c pactlab:${ENV_NAME}:serviceImageTag="$CURRENT" $RUNNING_CTX || true
          $CDK deploy "$STACK" --require-approval never -c pactlab:${ENV_NAME}:serviceImageTag="$CURRENT" $RUNNING_CTX \
            --outputs-file "$RUNNER_TEMP/outputs.json"

      - name: 3. Migrations
        if: steps.plan.outputs.migrations == 'true'
        run: |
          out() { node -e "console.log(require(process.argv[1])[process.argv[2]][process.argv[3]])" "$RUNNER_TEMP/outputs.json" "$STACK" "$1"; }
          CLUSTER=$(out ClusterName); FAMILY=$(out MigrateTaskDefinition)
          SUBNETS=$(out AppSubnets); GROUP=$(out AppTaskSecurityGroupId)
          TASK=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$FAMILY" --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$GROUP],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"
          CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exit code: $CODE"
          test "$CODE" = "0"

      - name: 4. Move the services to the release
        id: release
        run: |
          # dev and qa: the worker is moved alongside the stack update, without CloudFormation's minutes-long wait.
          DONE="$RUNNER_TEMP/cdk-exit"; : > "$DONE"
          ( set +e; $CDK deploy "$STACK" --require-approval never $RELEASE_CTX --outputs-file "$RUNNER_TEMP/outputs.json"; echo $? > "$DONE" ) &
          CDK_PID=$!
          ROLL_PID=""
          if [ "$ENV_NAME" = dev ] || [ "$ENV_NAME" = qa ]; then scripts/roll-worker.sh "$STACK" "$DONE" & ROLL_PID=$!; fi
          wait "$CDK_PID"
          ROLL=0; [ -z "$ROLL_PID" ] || wait "$ROLL_PID" || ROLL=$?
          test "$(cat "$DONE")" = 0 && test "$ROLL" = 0
          ORIGIN=$(node -e "console.log(require(process.argv[1])[process.argv[2]].Origin)" "$RUNNER_TEMP/outputs.json" "$STACK")
          echo "origin=$ORIGIN" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          ORIGIN="${{ steps.release.outputs.origin }}"
          curl --fail --silent --show-error --retry 10 --retry-delay 15 --retry-all-errors "$ORIGIN/health"
          curl --fail --silent --show-error --output /dev/null --retry 5 --retry-delay 10 --retry-all-errors "$ORIGIN/login"

      # 5. The environment's own site (<env>.pactlab.ai): Sign up / Sign in go to this app (app.<env>.pactlab.ai).
      #    Closed to search engines (robots.txt and noindex). Skipped until the environment sets SITE_DOMAIN.
      - name: 5. Publish the environment's site
        if: vars.SITE_DOMAIN != '' && steps.plan.outputs.site == 'true'
        env:
          NEXT_PUBLIC_APP_URL: https://${{ vars.APP_DOMAIN }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.SITE_CONTACT_EMAIL }}
          NEXT_PUBLIC_SITE_INDEXING: none
          # dev and qa preview every pack for testing before release; stage and live show released packs only.
          NEXT_PUBLIC_PACK_PREVIEW: ${{ (inputs.environment == 'dev' || inputs.environment == 'qa') && 'true' || 'false' }}
        run: |
          pnpm --filter @pactlab/site build
          CERT="${{ vars.SITE_CERTIFICATE_ARN }}"
          $CDK deploy "${STACK}Site" --require-approval never ${CERT:+-c pactlab:${ENV_NAME}:siteCertificateArn=$CERT} \
            --outputs-file "$RUNNER_TEMP/site.json"
          SITE=$(node -e "console.log(require(process.argv[1])[process.argv[2]].SiteUrl)" "$RUNNER_TEMP/site.json" "${STACK}Site")
          echo "Site: $SITE (custom domain: https://${{ vars.SITE_DOMAIN }} once its DNS points at it)"
          curl --fail --silent --show-error --output /dev/null --retry 5 --retry-delay 10 --retry-all-errors "$SITE/"
          curl --fail --silent --show-error "$SITE/robots.txt" | grep -q "Disallow: /"

