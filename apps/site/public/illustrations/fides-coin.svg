<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="A Roman coin showing clasped right hands, the emblem of Fides">
  <defs>
    <radialGradient id="metal" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e9ecff"/>
      <stop offset=".55" stop-color="#b8c0ff"/>
      <stop offset="1" stop-color="#6978ff"/>
    </radialGradient>
    <path id="arc" d="M 110 240 A 130 130 0 0 1 370 240"/>
  </defs>
  <circle cx="240" cy="240" r="210" fill="#081127"/>
  <circle cx="240" cy="240" r="188" fill="url(#metal)"/>
  <circle cx="240" cy="240" r="172" fill="none" stroke="#081127" stroke-opacity=".35" stroke-width="2" stroke-dasharray="1 9" stroke-linecap="round"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="14" fill="#081127">
    <textPath href="#arc" startOffset="50%" text-anchor="middle">FIDES</textPath>
  </text>
  <g fill="#081127">
    <!-- left forearm and hand -->
    <path d="M96 300 L 196 262 C 206 258 214 262 216 270 L 222 292 C 224 300 218 306 210 308 L 112 330 Z"/>
    <!-- right forearm and hand -->
    <path d="M384 300 L 284 262 C 274 258 266 262 264 270 L 258 292 C 256 300 262 306 270 308 L 368 330 Z"/>
    <!-- clasp -->
    <rect x="200" y="252" width="80" height="60" rx="26"/>
  </g>
  <g fill="none" stroke="#b8c0ff" stroke-width="3" stroke-linecap="round">
    <path d="M222 262 v40M236 258 v46M250 258 v46M264 262 v40"/>
    <path d="M206 278 c 10 -6 18 -4 22 4" />
  </g>
  <text x="240" y="380" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="6" fill="#081127">PACTVM</text>
</svg>
