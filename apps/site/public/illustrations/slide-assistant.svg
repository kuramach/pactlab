<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="A chat with an AI assistant answering from a Pactlab pact, with a citation to the source document">
  <rect width="640" height="420" rx="24" fill="#f8faff"/>
  <g font-family="Manrope, sans-serif" font-weight="700" font-size="13" fill="#081127">
    <rect x="96" y="56" width="448" height="308" rx="18" fill="#fff" stroke="#e3e8f2" stroke-width="3"/>
    <rect x="96" y="56" width="448" height="44" rx="18" fill="#081127"/>
    <rect x="96" y="82" width="448" height="18" fill="#081127"/>
    <circle cx="122" cy="78" r="6" fill="#6978ff"/>
