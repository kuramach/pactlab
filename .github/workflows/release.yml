name: release

# Cut a release (T-100): the next CalVer tag vYYYY.MM.N on the dispatched commit of main, and a
# GitHub Release with generated notes. A release is a deliberate act: nothing tags itself on merge.
# Then promote the commit as usual with the deploy workflow (interim path: dev → live; docs/release.md).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: main only
        env:
          REF: ${{ github.ref_name }}
        run: |
          if [ "$REF" != main ]; then echo "::error title=main only::releases are cut from main (this run is on $REF)"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Next tag
        id: tag
        run: |
          TAG=$(git tag --list 'v*' | scripts/next-release-tag.sh "$(date -u +%Y.%m)")
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then echo "::error::$TAG already exists"; exit 1; fi
          # One release per commit: a commit that already carries a release tag is not tagged again.
          EXISTING=$(git tag --points-at HEAD --list 'v*' | head -1)
          if [ -n "$EXISTING" ]; then echo "::error::this commit is already release $EXISTING"; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release $TAG on $(git rev-parse --short HEAD)"
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          echo "Release **$TAG** ($(git rev-parse --short HEAD)) — now deploy it: Actions → deploy → main → dev, then live." >> "$GITHUB_STEP_SUMMARY"
