name: e2e-full
# The whole browser suite, including @slow tests: the gate for promoting a
# build dev → qa → stage → production. Every PR runs only the fast suite (ci.yml).
# The promotion workflow (T-007) calls this with `workflow_call`; until then it
# runs nightly and on demand.
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pactlab_owner
          POSTGRES_PASSWORD: pactlab_owner_ci
          POSTGRES_DB: pactlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pactlab_owner -d pactlab"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_DATABASE_MIGRATION_URL: postgresql://pactlab_owner:pactlab_owner_ci@localhost:5432/pactlab
      E2E_DATABASE_URL: postgresql://pactlab_api:pactlab_api_ci@localhost:5432/pactlab
      E2E_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision runtime database roles (CI only)
        run: |
          psql "$E2E_DATABASE_MIGRATION_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE pactlab_app NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          CREATE ROLE pactlab_api LOGIN PASSWORD 'pactlab_api_ci' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOINHERIT;
          GRANT pactlab_app TO pactlab_api;
          SQL
      - run: pnpm --filter @pactlab/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e:full
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7
