    <rect x="120" y="304" width="400" height="40" rx="20" fill="#fff" stroke="#e3e8f2"/>
    <text x="142" y="329" font-weight="600" fill="#8a93a8">Ask about your pacts…</text>
    <path d="M488 312 l20 12 -20 12z" fill="#6978ff"/>
    <g transform="translate(452 196)">
