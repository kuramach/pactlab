name: wake

# Wakes dev, qa or stage (ADR 0019, ADR 0063). Paused (after an idle hour): the quick wake, about 5–8 minutes.
# Hibernated (after 3 idle hours): dispatches env-power.yml to rebuild it from its snapshot, about 30–40 minutes.
# The page at app.<env>.pactlab.ai does the same with its button, from any browser. Live is always on.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to wake
        type: choice
        options: [dev, qa, stage]
        required: true

permissions:
  id-token: write
  contents: read
  actions: write

env:
  AWS_REGION: us-east-2

jobs:
  wake:
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: wake-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Wake
        env:
          ENV_NAME: ${{ inputs.environment }}
          GH_TOKEN: ${{ github.token }}
        run: |
          POWER=$(aws ssm get-parameter --name "/pactlab/${ENV_NAME}/power" --query Parameter.Value --output text 2>/dev/null || echo none)
          case "$POWER" in
            hibernated)
              gh workflow run env-power.yml --ref main -f environment="$ENV_NAME" -f action=wake
              echo "${ENV_NAME} is hibernated: rebuilding it from its snapshot (about 30–40 minutes; see the env-power run)." | tee -a "$GITHUB_STEP_SUMMARY" ;;
            rebuilding | hibernating) echo "${ENV_NAME} is ${POWER}; see the env-power run." | tee -a "$GITHUB_STEP_SUMMARY" ;;
            *) scripts/wake-environment.sh "$ENV_NAME" ;;
          esac
