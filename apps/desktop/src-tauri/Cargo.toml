[package]
name = "pactlab-rinse"
version = "0.1.0"
description = "Pactlab Rinse — rinse your deal documents clean before they go in the room."
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
# The engine runs as a Node sidecar (T-178b); the window talks to it, never to the network itself.
tauri-plugin-shell = "2"
# Prep invites open the app: pactlab-rinse://invite?token=… (the pactlab.ai/rinse page hands off, T-178c).
tauri-plugin-deep-link = "2"
# The seller chooses the folder to rinse, a file for a gap, and where the finished set goes (T-178e).
tauri-plugin-dialog = "2"
