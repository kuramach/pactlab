name: deploy

# Deploys one application environment (ADR 0019). Dispatched by a person; the
# job waits on that environment's GitHub Environment (reviewers, variables).
# AWS access is short-lived via GitHub OIDC; no stored AWS keys.
#
# Order, so code never runs ahead of its schema (a paused environment is woken first):
#   1. registry stack, then build and push the release images (tag = commit SHA), in
#      parallel with layers cached between runs
#   2. app stack with the release on the one-off tasks only; services stay on the
#      image they run (zero tasks on a first deploy)
#   3. migrations (one-off task); a failure stops here
#   4. app stack again with the services on the release; wait for them; smoke test
#   5. the environment's copy of the marketing site, built to point at this app (never indexed)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev]
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  # The organization's guardrail allows CloudFormation only in us-east-2 (ADR 0003 amendment).
  AWS_REGION: us-east-2
  ENV_NAME: ${{ inputs.environment }}
  TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.release.outputs.origin }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Names
        run: |
          STACK="Pactlab$(echo "${ENV_NAME:0:1}" | tr a-z A-Z)${ENV_NAME:1}"
          echo "STACK=$STACK" >> "$GITHUB_ENV"
          echo "CDK=pnpm --filter @pactlab/cdk exec cdk -c pactlab:${ENV_NAME}:account=${{ vars.AWS_ACCOUNT_ID }} -c pactlab:${ENV_NAME}:imageTag=${TAG} -c pactlab:${ENV_NAME}:githubOidc=existing" >> "$GITHUB_ENV"

      # dev, qa and stage pause when idle (ADR 0019): wake a paused environment before changing it.
      - name: 0. Make sure the environment is awake
        run: scripts/wake-environment.sh "$ENV_NAME"

      - name: 1. Registry
        run: $CDK deploy "${STACK}Registry" --require-approval never

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3

      - name: 1. Which images this commit still needs
        id: need
        run: |
          TARGETS=""
          for IMAGE in server web; do
            if aws ecr describe-images --repository-name "pactlab-${ENV_NAME}-${IMAGE}" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
              echo "pactlab-${ENV_NAME}-${IMAGE}:${TAG} already pushed"
            else
              TARGETS="${TARGETS:+$TARGETS,}$IMAGE"
            fi
          done
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

      # Both images in one parallel build, sharing the dependency and build layers. Layers are cached in
      # GitHub Actions' cache between runs (server: shared; web: per environment), so a code-only change
      # skips the package download and reuses everything that did not change. See infra/docker/docker-bake.hcl.
      - name: 1. Build and push images (parallel, cached)
        if: steps.need.outputs.targets != ''
        uses: docker/bake-action@v6
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ENV_NAME: ${{ env.ENV_NAME }}
          TAG: ${{ env.TAG }}
          APP_ENV: ${{ vars.APP_ENV }}
          ORIGIN: https://${{ vars.APP_DOMAIN }}
          CACHE: gha
        with:
          source: .
          files: infra/docker/docker-bake.hcl
          targets: ${{ steps.need.outputs.targets }}
          push: true

      - name: 2. Ship the release to the one-off tasks (services stay on their current image)
        run: |
          CURRENT=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceImageTag'].OutputValue" --output text 2>/dev/null || true)
          if [ -z "$CURRENT" ] || [ "$CURRENT" = "None" ]; then CURRENT=none; fi
          echo "Services stay on: $CURRENT"
          $CDK diff "$STACK" --method=template -c pactlab:${ENV_NAME}:serviceImageTag="$CURRENT" || true
          $CDK deploy "$STACK" --require-approval never -c pactlab:${ENV_NAME}:serviceImageTag="$CURRENT" \
            --outputs-file "$RUNNER_TEMP/outputs.json"

      - name: 3. Migrations
        run: |
          out() { node -e "console.log(require(process.argv[1])[process.argv[2]][process.argv[3]])" "$RUNNER_TEMP/outputs.json" "$STACK" "$1"; }
          CLUSTER=$(out ClusterName); FAMILY=$(out MigrateTaskDefinition)
          SUBNETS=$(out AppSubnets); GROUP=$(out AppTaskSecurityGroupId)
          TASK=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$FAMILY" --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$GROUP],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"
          CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exit code: $CODE"
          test "$CODE" = "0"

      - name: 4. Move the services to the release
        id: release
        run: |
          $CDK deploy "$STACK" --require-approval never --outputs-file "$RUNNER_TEMP/outputs.json"
          ORIGIN=$(node -e "console.log(require(process.argv[1])[process.argv[2]].Origin)" "$RUNNER_TEMP/outputs.json" "$STACK")
          echo "origin=$ORIGIN" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          ORIGIN="${{ steps.release.outputs.origin }}"
          curl --fail --silent --show-error --retry 10 --retry-delay 15 --retry-all-errors "$ORIGIN/health"
          curl --fail --silent --show-error --output /dev/null --retry 5 --retry-delay 10 --retry-all-errors "$ORIGIN/login"

      # 5. The environment's own site (<env>.pactlab.ai): Sign up / Sign in go to this app (app.<env>.pactlab.ai).
      #    Closed to search engines (robots.txt and noindex). Skipped until the environment sets SITE_DOMAIN.
      - name: 5. Publish the environment's site
        if: vars.SITE_DOMAIN != ''
        env:
          NEXT_PUBLIC_APP_URL: https://${{ vars.APP_DOMAIN }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.SITE_CONTACT_EMAIL }}
          NEXT_PUBLIC_SITE_INDEXING: none
        run: |
          pnpm --filter @pactlab/site build
          CERT="${{ vars.SITE_CERTIFICATE_ARN }}"
          $CDK deploy "${STACK}Site" --require-approval never ${CERT:+-c pactlab:${ENV_NAME}:siteCertificateArn=$CERT} \
            --outputs-file "$RUNNER_TEMP/site.json"
          SITE=$(node -e "console.log(require(process.argv[1])[process.argv[2]].SiteUrl)" "$RUNNER_TEMP/site.json" "${STACK}Site")
          echo "Site: $SITE (custom domain: https://${{ vars.SITE_DOMAIN }} once its DNS points at it)"
          curl --fail --silent --show-error --output /dev/null --retry 5 --retry-delay 10 --retry-all-errors "$SITE/"
          curl --fail --silent --show-error "$SITE/robots.txt" | grep -q "Disallow: /"

